<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/buyer-favicon.svg" />
    <link rel="alternate icon" type="image/webp" href="/favicon.webp" />
    <meta name="description" content="CartNOW - Discover millions of trending products across electronics, fashion, beauty, home decor & daily deals with instant fast delivery and secure checkout." />
    <meta name="keywords" content="ecommerce, online shopping, electronics, fashion, deals, CartNOW, instant delivery" />
    <meta name="author" content="CartNOW Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CartNOW | Shop Smarter Every Day" />
    <meta property="og:description" content="Discover millions of trending products across electronics, fashion, beauty, home decor & daily deals with instant fast delivery and secure checkout." />
    <meta property="og:image" content="/favicon.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CartNOW | Shop Smarter Every Day" />
    <meta name="twitter:description" content="Discover millions of trending products across electronics, fashion, beauty, home decor & daily deals with instant fast delivery and secure checkout." />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Google Fonts Preconnect & High Priority Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dancing+Script:wght@500;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" />

    <!-- CDN & API Preconnects -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preload" as="image" href="/hero_slide_1.webp" type="image/webp" fetchpriority="high" />
    <link rel="canonical" href="https://cartnow-omega.vercel.app/" />

    <title>CartNOW | Shop Smarter Every Day</title>
    <script>
      (function() {
        const saved = localStorage.getItem("theme");
        if (saved === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
