<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium radial background -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Main cart gradient: vibrant orange to violet-pink -->
    <linearGradient id="cart-grad" x1="60" y1="60" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7e40" />
      <stop offset="50%" stop-color="#ff3860" />
      <stop offset="100%" stop-color="#b826f6" />
    </linearGradient>

    <!-- Lightning / speed gradient: glowing gold to orange -->
    <linearGradient id="bolt-grad" x1="100" y1="80" x2="180" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd53e" />
      <stop offset="100%" stop-color="#ff7e40" />
    </linearGradient>

    <!-- Glow effect filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="256" height="256" rx="60" fill="url(#bg-grad)" />
  <!-- Dynamic glowing inner border -->
  <rect x="2" y="2" width="252" height="252" rx="58" stroke="url(#cart-grad)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Speed streaks (wind trails) on the left representing instant delivery -->
  <g opacity="0.6">
    <path d="M 40 85 L 60 85" stroke="url(#cart-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 32 110 L 52 110" stroke="url(#cart-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 36 135 L 56 135" stroke="url(#cart-grad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Group with shadow for the entire cart assembly -->
  <g filter="url(#shadow)">
    <!-- Cart Basket Outlines (Premium thick stroke) -->
    <path d="M 68 76 C 68 70 72 66 78 66 H 90 C 94.5 66 98.3 69.2 99.1 73.6 L 102 90 H 186 C 193 90 198 96 196 102.5 L 184 142.5 C 182.5 147.5 178 151 172.5 151 H 112 L 100 90" 
          stroke="url(#cart-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Lightning Bolt (Fast Delivery "NOW") inside the basket -->
    <path d="M 160 80 L 115 132 H 144 L 126 172 L 174 114 H 146 L 160 80 Z" 
          fill="url(#bolt-grad)" filter="url(#glow)" />
  </g>

  <!-- Glowing wheels with metallic centers -->
  <!-- Left Wheel -->
  <g filter="url(#shadow)">
    <circle cx="112" cy="192" r="16" fill="#111827" stroke="url(#cart-grad)" stroke-width="5.5" />
    <circle cx="112" cy="192" r="6" fill="#ffffff" />
  </g>

  <!-- Right Wheel -->
  <g filter="url(#shadow)">
    <circle cx="172" cy="192" r="16" fill="#111827" stroke="url(#cart-grad)" stroke-width="5.5" />
    <circle cx="172" cy="192" r="6" fill="#ffffff" />
  </g>
</svg>
