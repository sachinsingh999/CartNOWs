<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .brand-text-now {
        fill: #1e293b;
      }
      .cart-accent {
        stroke: #1e293b;
      }
      @media (prefers-color-scheme: dark) {
        .brand-text-now {
          fill: #f8fafc;
        }
        .cart-accent {
          stroke: #f8fafc;
        }
      }
    </style>
  </defs>

  <!-- Wind trails (speed lines) on the left -->
  <line x1="12" y1="32" x2="28" y2="32" class="cart-accent" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="6" y1="39" x2="22" y2="39" class="cart-accent" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="14" y1="46" x2="30" y2="46" class="cart-accent" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Cart Handle -->
  <path d="M 38 27 L 28 21 L 26 26" class="cart-accent" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Cart Basket -->
  <path d="M 38 27 H 92 L 82 51 H 46 Z" class="cart-accent" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Chassis & Wheel Mounts -->
  <path d="M 40 51 L 46 57 H 80" class="cart-accent" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Wheels -->
  <circle cx="48" cy="63" r="6" class="brand-text-now" />
  <circle cx="48" cy="63" r="2" fill="#ffffff" />
  <circle cx="78" cy="63" r="6" class="brand-text-now" />
  <circle cx="78" cy="63" r="2" fill="#ffffff" />

  <!-- Text inside basket -->
  <text x="64" y="44" fill="#f97316" font-size="20" font-weight="900" font-family="'Inter', 'Arial Black', sans-serif" font-style="italic" text-anchor="middle">cart</text>

  <!-- Rope / Connection leash -->
  <line x1="92" y1="36" x2="114" y2="36" class="cart-accent" stroke-width="3" stroke-linecap="round" />

  <!-- Pulling Figure 'n' -->
  <path d="M 112 56 L 118 44 L 125 32 C 128 27 134 27 137 32 L 142 44 L 148 56" class="cart-accent" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 121 39 H 114" class="cart-accent" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Letters 'ow' -->
  <text x="154" y="52" class="brand-text-now" font-size="28" font-weight="900" font-family="'Inter', 'Arial Black', sans-serif">ow</text>
</svg>
