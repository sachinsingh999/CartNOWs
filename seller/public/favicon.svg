<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Indigo -> Purple -> Orange) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#7c3aed" /> <!-- Purple -->
      <stop offset="100%" stop-color="#f97316" /> <!-- Orange -->
    </linearGradient>

    <!-- Premium Drop Shadow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Smooth Rounded Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Main Symbol Group -->
  <g filter="url(#glow)">
    <!-- Storefront Awning / Roof -->
    <path d="M16 30 L13 35 H51 L48 30 H16 Z" fill="#ffffff" />
    <path d="M13 35 C13 36.5 14.5 37.5 16 37.5 C17.5 37.5 19 36.5 19 35 C19 36.5 20.5 37.5 22 37.5 C23.5 37.5 25 36.5 25 35 C25 36.5 26.5 37.5 28 37.5 C29.5 37.5 31 36.5 31 35 C31 36.5 32.5 37.5 34 37.5 C35.5 37.5 37 36.5 37 35 C37 36.5 38.5 37.5 40 37.5 C41.5 37.5 43 36.5 43 35 C43 36.5 44.5 37.5 46 37.5 C47.5 37.5 49 36.5 49 35 C49 36.5 50.5 37.5 51 35" fill="#ffffff" />
    
    <!-- Store Columns & Platform -->
    <path d="M18 37.5 V48 H46 V37.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" />
    <path d="M14 48 H50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Store Roof Ridge -->
    <path d="M18 30 L32 20 L46 30" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" />

    <!-- Gold Lightning Bolt inside the shop (representing speed/NOW) -->
    <path d="M35 24 L25 36 H33 L29 46 L39 34 H31 L35 24 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>